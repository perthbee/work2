<!DOCTYPE html >

<head></head>
<body>
    <h1>มหาวิทยาลัยราชภัฎนครปฐม</h1>
    <button>เปลี่ยนข้อความ</button>

<script>

    const butg = document.querySelector("button")
    const mah = document.querySelector("h1")

    butg.addEventListener("click",function(){
        mah.textContent = "ยินดีต้อนรับครับ";

    });

   
</script>
